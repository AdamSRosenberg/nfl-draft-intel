name: Daily NFL Draft Intel Scrape

on:
  schedule:
    - cron: '0 11 * * *'  # 7am ET every day
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py --save

      - name: Commit updated data
        run: |
          git config --global user.email "nfldraftbot@github.com"
          git config --global user.name "NFL Draft Bot"
          git add draft_intel.json
          git diff --staged --quiet || git commit -m "Daily intel update $(date +'%Y-%m-%d %H:%M')"
          git push
