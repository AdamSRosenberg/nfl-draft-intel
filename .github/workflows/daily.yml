name: Daily NFL Draft Intel Scrape
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install feedparser requests beautifulsoup4
      - run: python scraper.py --save
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Draft Bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/AdamSRosenberg/nfl-draft-intel.git
          git add draft_intel.json
          git diff --staged --quiet || git commit -m "Daily update $(date +'%Y-%m-%d')"
          git push
